
{% extends "base.html" %}

{% block content %}

<div class="card p-4">

    <h3>Update Completed Maintenance</h3>

    <form method="post"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-primary">

            Save Maintenance Record

        </button>

    </form>

</div>

{% endblock %}
