
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Maintenance Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            background: #172b4d;
            min-height: 100vh;
            color: white;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #29456f;
        }

        .stat-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000012;
        }

        .table-hover {
            --bs-table-hover-bg: #dbe7ff;
        }
    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <nav class="col-md-2 sidebar p-3">

            <h5>Maintenance Manager</h5>
            <small class="text-white-50">{{ user.get_username }}</small>

            <hr>

            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'todo' %}">To do List</a>
            <a href="{% url 'equipment' %}">Equipment</a>
            <a href="{% url 'reports' %}">Reports</a>



            {% if user.is_staff %}
            <a href="/admin/maintenance/site/">Sites</a>
            <a href="/admin/maintenance/maintenanceschedule/">Maintenance</a>
            <a href="/admin/maintenance/maintenancehistory/">History</a>
            <a href="/admin/">Administration</a>
            {% endif %}

            <hr>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light">Logout</button>
            </form>

        </nav>

        <main class="col-md-10 p-4">
            {% for m in messages %}
            <div class="alert alert-success">{{ m }}</div>
            {% endfor %}

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

</body>
</html>
