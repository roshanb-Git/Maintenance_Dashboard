
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Maintenance Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            background: #172b4d;
            min-height: 100vh;
            color: white;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #29456f;
        }

        .stat-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000012;
        }
    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <nav class="col-md-2 sidebar p-3">

            <h5>Maintenance Manager</h5>

            <hr>

            <a href="/">Dashboard</a>
            <a href="/admin/maintenance/site/">Sites</a>
            <a href="/admin/maintenance/equipment/">Equipment</a>
            <a href="/admin/maintenance/maintenanceschedule/">
                Maintenance
            </a>

            <a href="/admin/maintenance/maintenancehistory/">
                History
            </a>

            <a href="/reports/">Reports</a>

            {% if user.is_staff %}
            <a href="/admin/">Administration</a>
            {% endif %}

            <hr>

            <form method="post"
                  action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light">
                    Logout
                </button>
            </form>

        </nav>

        <main class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

</body>
</html>
