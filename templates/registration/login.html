
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Maintenance Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #172b4d, #29456f);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px #00000040;
        }

        .login-title {
            color: #172b4d;
            font-weight: 700;
        }

        .btn-login {
            background: #172b4d;
            border-color: #172b4d;
            color: white;
        }

        .btn-login:hover {
            background: #29456f;
            border-color: #29456f;
            color: white;
        }
    </style>
</head>

<body>

<div class="card login-card p-4 m-3">

    <div class="text-center mb-4">
        <h3 class="login-title">Maintenance Manager</h3>
        <p class="text-muted mb-0">Sign in to continue</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger py-2">
        Incorrect username or password.
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username"
                   class="form-control form-control-lg"
                   autofocus required>
        </div>

        <div class="mb-4">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password"
                   class="form-control form-control-lg" required>
        </div>

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="btn btn-login btn-lg w-100">
            Login
        </button>
    </form>

</div>

</body>
</html>
